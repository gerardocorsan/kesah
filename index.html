<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cline x1='9' y1='23' x2='23' y2='9' stroke='%236b7280' stroke-width='3'/%3E%3Ccircle cx='9' cy='23' r='6' fill='%232563eb'/%3E%3Ccircle cx='23' cy='9' r='6' fill='%232563eb'/%3E%3C/svg%3E" />
    <title>Kesah · Graph editor</title>
  </head>
  <body>
    <header class="toolbar">
      <h1>Kesah</h1>
      <button id="btn-new" type="button" title="Clear the canvas">New</button>
      <label class="checkbox" title="Edges have a direction and are drawn with an arrowhead">
        <input id="chk-directed" type="checkbox" checked /> Directed
      </label>
      <button id="btn-fit" type="button" title="Fit the whole graph in view">Fit view</button>
      <span class="spacer"></span>
      <button id="btn-export" type="button">Export JSON</button>
      <label class="button">Import JSON<input id="file-import" type="file" accept="application/json,.json" hidden /></label>
      <span id="status" class="status" aria-live="polite"></span>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="Graph tools">
        <section class="panel">
          <h2>Tools</h2>
          <button id="btn-add-node" type="button" title="Add a node in the middle of the view">Add node</button>
          <button id="btn-connect" type="button" aria-pressed="false" title="Connect mode: drag from one node to another. Shortcut: hold Shift">Connect</button>
        </section>
        <section class="panel">
          <h2 id="inspector-title">Selection</h2>
          <p id="inspector-empty" class="muted">Click a node or an edge to edit it.</p>
          <form id="inspector-form" hidden>
            <label class="field">
              <span id="label-text">Name</span>
              <input id="inp-label" type="text" autocomplete="off" spellcheck="false" />
            </label>
            <p id="inspector-info" class="muted"></p>
            <button id="btn-delete" type="button" class="danger" title="Delete the selected node or edge (Delete key)">Delete</button>
          </form>
        </section>
        <section class="panel panel-grow">
          <h2>Nodes <span id="node-count" class="count"></span></h2>
          <ul id="node-list" class="node-list"></ul>
        </section>
      </aside>
      <main id="canvas" class="canvas"></main>
    </div>
    <footer class="hint">
      Double-click the background: new node · Drag a node: move · Shift + drag from one node to another: connect ·
      Double-click a node or edge: rename · Delete: remove the selection · Wheel: zoom · Drag the background: pan
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
